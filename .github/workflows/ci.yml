name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, format, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  hardcoded:
    name: No hardcoded deployment values
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-hardcoded.ts
      - run: node scripts/check-import-order.ts

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  compose:
    name: Compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: sed -i "s|^KEY_ENCRYPTION_KEY=.*|KEY_ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
      - run: |
          for name in POSTGRES_PASSWORD DB_IDENTITY_PASSWORD DB_NOTIFY_PASSWORD DB_OIDC_PASSWORD \
            DB_SAFETY_PASSWORD DB_SUPPORT_PASSWORD DB_GAMES_PASSWORD DB_AUDIT_PASSWORD \
            GRAFANA_ADMIN_PASSWORD EDGE_HOSTS EDGE_ACME_EMAIL; do
            if [ "$name" = "EDGE_HOSTS" ]; then
              sed -i "s|^$name=.*|$name=localhost|" .env
            elif [ "$name" = "EDGE_ACME_EMAIL" ]; then
              sed -i "s|^$name=.*|$name=test@example.com|" .env
            else
              sed -i "s|^$name=.*|$name=$(openssl rand -hex 32)|" .env
            fi
          done
      - run: >-
          docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.dev.yaml
          --profile '*' config --quiet
      - run: docker compose --env-file .env -f deploy/compose.yaml run --rm notifier qtiauth db provision
      - run: docker compose --env-file .env -f deploy/compose.yaml up --wait --wait-timeout 120
      - run: >-
          docker compose --env-file .env -f deploy/compose.yaml --profile games
          up --wait --wait-timeout 120
      - if: failure()
        run: docker compose --env-file .env -f deploy/compose.yaml --profile games logs
      - if: always()
        run: docker compose --env-file .env -f deploy/compose.yaml --profile '*' down --volumes

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --audit-level high

  discover-images:
    name: Find service images
    runs-on: ubuntu-latest
    outputs:
      dockerfiles: ${{ steps.find.outputs.dockerfiles }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: |
          files=$(git ls-files 'services/*/Dockerfile' 'templates/*/Dockerfile' | jq -R . | jq -sc .)
          echo "dockerfiles=$files" >> "$GITHUB_OUTPUT"

  images:
    name: Image ${{ matrix.dockerfile }}
    runs-on: ubuntu-latest
    needs: [checks, discover-images]
    if: needs.discover-images.outputs.dockerfiles != '[]'
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJson(needs.discover-images.outputs.dockerfiles) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build (amd64, for scanning)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: qtiauth-ci:scan
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: qtiauth-ci:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Build (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.dockerfile }}

  commitlint:
    name: Conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
