# yaml-language-server: $schema=./qtiauth.schema.json
#
# Development configuration, used by deploy/compose.dev.yaml. Anything left out uses its default. Emails are printed to the notifier's logs instead of being sent, and the surfaces accept browsers on http://localhost:8000. See docs/deployment.md.

surfaces:
  account: { hosts: [localhost], base_path: /, origins: ['http://localhost:8000'] }
  support: { hosts: [localhost], base_path: /support, origins: ['http://localhost:8000'] }
  api: { hosts: [localhost], base_path: /api, origins: ['http://localhost:8000'] }

database:
  roles:
    identity: { password: '${env:DB_IDENTITY_PASSWORD}' }
    notify: { password: '${env:DB_NOTIFY_PASSWORD}' }
    oidc: { password: '${env:DB_OIDC_PASSWORD}' }
    safety: { password: '${env:DB_SAFETY_PASSWORD}' }
    support: { password: '${env:DB_SUPPORT_PASSWORD}' }
    games: { password: '${env:DB_GAMES_PASSWORD}' }
  audit: { password: '${env:DB_AUDIT_PASSWORD}' }

bus:
  password: '${env:NATS_PASSWORD}'

valkey:
  password: '${env:VALKEY_PASSWORD}'

gateway:
  identity_keys: { encryption_key: '${env:KEY_ENCRYPTION_KEY}' }

oidc:
  signing: { encryption_key: '${env:KEY_ENCRYPTION_KEY}' }

safety:
  csea: { encryption_key: '${env:APP_ENCRYPTION_KEY}' }

observability:
  logs: { user_id_hash_key: '${env:LOG_USER_ID_HASH_KEY}' }

security:
  encryption_key: '${env:APP_ENCRYPTION_KEY}'

features:
  auth:
    social:
      google:
        client_id: ${env:GOOGLE_CLIENT_ID}
        client_secret: ${env:GOOGLE_CLIENT_SECRET}
      github:
        client_id: ${env:GITHUB_CLIENT_ID}
        client_secret: ${env:GITHUB_CLIENT_SECRET}
      discord:
        client_id: ${env:DISCORD_CLIENT_ID}
        client_secret: ${env:DISCORD_CLIENT_SECRET}

email:
  provider: console
  smtp: { password: '${env:SMTP_PASSWORD}' }

storage:
  access_key: '${env:S3_ACCESS_KEY}'
  secret_key: '${env:S3_SECRET_KEY}'
