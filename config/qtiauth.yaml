# yaml-language-server: $schema=./qtiauth.schema.json
#
# QTIAuth configuration. Everything that isn't a secret goes here. Secrets live in .env and are referenced as ${env:NAME}, or read from a file with ${file:/run/secrets/name}. Every setting has a default, so any key can be left out. See docs/configuration.md.

branding:
  product_name: Example Account
  company_name: Example Ltd
  support_email: support@example.com
  logo: null
  colors: { primary: '#3b82f6' }

surfaces:
  account: { hosts: [me.example.com], base_path: / }
  support: { hosts: [me.example.com], base_path: /support }
  api: { hosts: [me.example.com], base_path: /api }

cookies:
  name: qtiauth_session
  domain: null # optional shared cookie domain; null -> host-only __Host- cookies
  session_ttl: 7d
  idle_timeout: 30d

cors:
  allowed_origins: [] # surface origins are added automatically

network:
  trusted_proxies: []

geoip:
  source: dbip_lite # dbip_lite | maxmind | header | none
  header: null
  database_path: /var/lib/qtiauth/geoip/dbip-country-lite.csv.gz

text_filter:
  lists_dir: lists/username

database:
  host: postgres
  port: 5432
  name: qtiauth
  ssl: disable # disable | require | verify-full
  pool: { max: 10, idle_timeout: 30s, connect_timeout: 10s }
  roles:
    identity: { user: qtiauth_identity, password: '${env:DB_IDENTITY_PASSWORD}' }
    notify: { user: qtiauth_notify, password: '${env:DB_NOTIFY_PASSWORD}' }
    oidc: { user: qtiauth_oidc, password: '${env:DB_OIDC_PASSWORD}' }
    safety: { user: qtiauth_safety, password: '${env:DB_SAFETY_PASSWORD}' }
    support: { user: qtiauth_support, password: '${env:DB_SUPPORT_PASSWORD}' }
    games: { user: qtiauth_games, password: '${env:DB_GAMES_PASSWORD}' }
  audit: { user: qtiauth_audit, password: '${env:DB_AUDIT_PASSWORD}' }

migrations:
  auto_apply: true

bus:
  servers: [nats://nats:4222]
  user: null
  password: '${env:NATS_PASSWORD}'
  tls: { required: false, ca_file: null }
  connect_timeout: 10s
  request_timeout: 5s
  streams: { replicas: 1, events_max_age: 7d, work_max_age: 7d, duplicate_window: 2m }
  outbox: { poll_interval: 1s, batch_size: 100, sent_retention: 1d }
  consumers:
    ack_wait: 30s
    max_deliver: 10
    retry_delay: 1s
    max_retry_delay: 5m
    dedupe_retention: 14d

observability:
  logs:
    level: info
    user_id_hash_key: '${env:LOG_USER_ID_HASH_KEY}'
    redact_keys: []
  tracing: { enabled: false, endpoint: 'http://tempo:4318/v1/traces', sample_ratio: 1 }
  metrics: { process_metrics: true }
  health: { check_timeout: 2s }

service:
  http: { port: 8080, shutdown_timeout: 15s }
  identity_tokens: { clock_tolerance: 5s, keys_refresh: 5m }

valkey:
  host: valkey
  port: 6379
  user: null
  password: '${env:VALKEY_PASSWORD}'
  database: 0
  tls: { enabled: false, ca_file: null }
  connect_timeout: 5s
  command_timeout: 1s

gateway:
  http: { port: 8000, max_body_size: 1048576, upstream_timeout: 30s }
  upstreams: {} # service -> base URL; default http://<service>:<service.http.port>
  discovery: { interval: 30s, expiry: 90s, startup_grace: 5s }
  session_cache: { ttl: 1m }
  identity_keys:
    encryption_key: '${env:KEY_ENCRYPTION_KEY}'
    rotate_after: 30d
    retain_after_rotation: 1h
  hsts: { max_age: 365d, include_subdomains: false, preload: false }

features:
  auth:
    password: { enabled: true }
    magic_link: { enabled: true }
    passkeys: { enabled: true }
    totp: { enabled: true }
    social:
      google:
        enabled: false
        client_id: ${env:GOOGLE_CLIENT_ID}
        client_secret: ${env:GOOGLE_CLIENT_SECRET}
      github:
        enabled: false
        client_id: ${env:GITHUB_CLIENT_ID}
        client_secret: ${env:GITHUB_CLIENT_SECRET}
      discord:
        enabled: false
        client_id: ${env:DISCORD_CLIENT_ID}
        client_secret: ${env:DISCORD_CLIENT_SECRET}
      steam: { enabled: false }
      generic_oidc: [] # [{ id, name, issuer, client_id, client_secret, scopes, icon }]
  session_security: { enabled: true }
  oidc:
    developer_portal: { enabled: true }
    backchannel_logout: { enabled: true }
  games:
    licensing: { enabled: true }
    steam: { enabled: false }
    leaderboards: { enabled: true, require_game_authority: true }
    playtime: { enabled: true }
    cloud_saves: { enabled: false }
    keys: { enabled: true }
  support:
    tickets: { enabled: true }
    kb: { enabled: true }
    guest_tickets: { enabled: true }
    attachments: { enabled: false }
  safety:
    reports: { enabled: true }
    game_intake: { enabled: true }
    automated_flags: { enabled: true }

captcha:
  provider: altcha # altcha | turnstile | hcaptcha | friendly_captcha | none
  after: 3

email:
  provider: smtp # smtp | brevo | postmark | ses | resend | mailgun | console
  from:
    auth: { name: Example Auth, address: auth@example.com }
    security: { name: Example Security, address: security@example.com }
    support: { name: Example Support, address: support@example.com }
  default_locale: en-GB
  templates_dir: templates/email
  smtp:
    host: localhost
    port: 587
    security: starttls # starttls | tls | none
    user: null
    password: '${env:SMTP_PASSWORD}'
    connect_timeout: 10s
    send_timeout: 30s
  queue: { max_attempts: 20, retry_delay: 10s, max_retry_delay: 30m }

webhooks:
  allow_private_targets: false
  disable_after_failures: 50
  timeout: 10s
  retry_window: 24h
  retry_delay: 1m
  max_retry_delay: 1h
  secret_overlap: 24h
  endpoints: {}

security:
  step_up_window: 10m
  encryption_key: '${env:APP_ENCRYPTION_KEY}'
  require_2fa_for_permissions:
    - users.*
    - safety.*
    - support.*
    - games.*
    - oidc.clients.*
    - webhooks.manage
    - audit.read
    - roles.manage
    - filter.*

roles:
  admin:
    name: Admin
    description: Full access, except permissions that must be granted by name.
    permissions: ['*']
  moderator:
    name: Moderator
    description: Moderate users, reports and the text filter.
    permissions:
      - users.read
      - users.ban
      - users.lock
      - users.edit_dob
      - users.force_username_reset
      - safety.reports.read
      - safety.actions.apply
      - filter.read
      - filter.manage
  support_agent:
    name: Support agent
    description: Handle support tickets.
    permissions: [users.read, support.tickets.staff]
  kb_editor:
    name: Knowledge-base editor
    description: Edit knowledge-base articles.
    permissions: [support.kb.edit]
  game_manager:
    name: Game manager
    description: Manage games, entitlements and keys.
    permissions: [games.catalog.edit, games.entitlements.grant, games.keys.manage]

accounts:
  max_per_email: 2
  email_normalization: # replaces the built-in rules; case is always ignored
    gmail.com: { remove_dots: true, subaddress_separator: '+', domain: null }
    googlemail.com: { remove_dots: true, subaddress_separator: '+', domain: gmail.com }
  email_change_ttl: 15m
  email_revert_ttl: 7d
  deletion_grace: 30d
  export_ttl: 7d
  export_email_max_bytes: 524288

magic_link:
  ttl: 15m
  signup_ttl: 30m

password:
  min_length: 10
  max_length: 256
  composition:
    require_lower: false
    require_upper: false
    require_digit: false
    require_symbol: false
  breach_check: true
  argon2: { memory_kib: 19456, iterations: 2, parallelism: 1 }
  reset_ttl: 15m
  verification_ttl: 15m
  failure_delay: { step: 250ms, max: 2s }

sessions:
  max_per_user: 10

session_security:
  on_country_change: challenge # challenge | block | notify | ignore
  new_device_email: true
  tls_fingerprint: { header: null }
  alert_min_interval: 1h

age:
  bands: { 13_to_15: 13, 16_to_17: 16, adult: 18 } # age each band starts at; younger is under_13
  assurance: { default_provider: self_declared, required_for: [] }

parental:
  consent_age: 13
  pending_ttl: 14d
  max_guardians: 2
  graduation_grace: 30d

usernames:
  min_length: 8
  max_length: 18
  charset: '[A-Za-z0-9_]'
  reserved: []
  reserved_prefixes: []
  change_cooldown: 30d
  changes_per_year: 3
  change_window: 365d
  release_hold: 90d

legal:
  public_history: true
  documents_dir: legal

safety:
  reports:
    reporter_ack: true
    reporter_outcome: true
    default_priority: normal
    max_note_length: 2000
    max_snapshot_bytes: 65536
    sla_check_interval: 1m
  taxonomy:
    types: {} # ids you set replace the built-in type of the same name; see docs/safety.md
  csea_alert_emails: [] # alert-only; bodies never contain case content
  csea:
    encryption_key: '${env:APP_ENCRYPTION_KEY}'
    nca_portal_url: '' # operator sets this after NCA CSEA-IRP registration; see docs/compliance/csea.md
    protective_lock: 7d
    priority_1: 15m
    priority_2: 4h
    priority_3: 24h
  accountable_person:
    name: ''
    role: ''

oidc:
  issuer: null # null uses the api surface origin
  resource: null # access token audience; null uses the issuer
  signing:
    algorithm: ES256 # ES256 | RS256
    encryption_key: '${env:KEY_ENCRYPTION_KEY}'
    rotate_after: 90d
    retain_after_rotation: 1h
  authorization_code_ttl: 1m
  access_ttl: 15m
  id_ttl: 15m
  refresh_ttl: 30d
  logout:
    timeout: 10s
    retry_window: 24h
    retry_delay: 1m
    max_retry_delay: 1h
    allow_private_targets: false
  developer_portal:
    max_clients_per_user: 10
  scopes: {} # built-in scopes stay; add or replace them here
  clients: {} # { client_id: { name, type, first_party, redirect_uris, secret, backchannel_logout_uri } }

rate_limits: # per: ip | user | client | email | account, or a list counted as one combination
  global: { per: ip, limit: 300, window: 1m }
  auth_password: { per: [ip, account], limit: 10, window: 15m, on_store_failure: closed }
  magic_link_email: { per: email, limit: 3, window: 1h, on_store_failure: closed }
  magic_link_ip: { per: ip, limit: 10, window: 1h, on_store_failure: closed }
  magic_link_ip_day: { per: ip, limit: 20, window: 1d, on_store_failure: closed }
  magic_link: { policies: [magic_link_email, magic_link_ip, magic_link_ip_day] }
  auth_verify: { per: ip, limit: 30, window: 15m, on_store_failure: closed }
  ticket_create: { per: user, limit: 5, window: 1h }
  guest_ticket: { per: ip, limit: 3, window: 1h }
  key_redeem: { per: [ip, user], limit: 10, window: 1h }
  kb_feedback: { per: ip, limit: 30, window: 1h }
  oauth_authorize: { per: ip, limit: 60, window: 1m }
  oauth_token: { per: ip, limit: 60, window: 1m, on_store_failure: closed }
  safety_report: { per: [ip, user], limit: 20, window: 1h, on_store_failure: closed }
  safety_intake: { per: client, limit: 600, window: 1m, on_store_failure: closed }

scheduler:
  timezone: UTC
  jobs:
    retention.sweep: { schedule: '0 3 * * *', enabled: true }
    parental.expire_pending: { schedule: '0 * * * *', enabled: true }
    parental.activity_summary: { schedule: '0 8 * * 1', enabled: true }
    parental.graduation: { schedule: '10 0 * * *', enabled: true }
    parental.removal_reminders: { schedule: '0 9 * * 1', enabled: true }
    accounts.purge_deleted: { schedule: '30 3 * * *', enabled: true }
    age.recompute_bands: { schedule: '5 0 * * *', enabled: true }
    accounts.unlock_expired: { schedule: '* * * * *', enabled: true }
    legal.publish: { schedule: '* * * * *', enabled: true }
    accounts.resume_exports: { schedule: '*/5 * * * *', enabled: true }
    deletion_ledger.prune: { schedule: '0 4 * * *', enabled: true }
    keys.rotate: { schedule: '0 0 * * *', enabled: true }
    webhooks.retry: { schedule: '* * * * *', enabled: true }
    oidc.logout.retry: { schedule: '* * * * *', enabled: true }
    support.auto_close: { schedule: '0 * * * *', enabled: true }
    safety.sla_sweep: { schedule: '* * * * *', enabled: true }
    safety.csea_retention: { schedule: '15 3 * * *', enabled: true }
    achievements.recompute_rarity: { schedule: '0 2 * * *', enabled: true }
    leaderboards.reset_periodic: { schedule: '* * * * *', enabled: true }
    steam.ownership_sync: { schedule: '0 5 * * *', enabled: true }
    backup.run: { schedule: '30 2 * * *', enabled: true }

retention:
  delivery_logs: 30d
  sessions: 30d
  tokens: 24h
  session_security_events: 90d
  filter_decisions: 30d
  audit: 730d
  oauth: 30d
  safety_reports: 730d
  csea_evidence: 365d
  csea_nca_reference: 1825d

storage:
  enabled: false
  endpoint: '' # http://minio:9000 for the bundled MinIO, or any S3/R2/B2 endpoint
  region: us-east-1
  bucket: qtiauth
  access_key: '${env:S3_ACCESS_KEY}'
  secret_key: '${env:S3_SECRET_KEY}'
  force_path_style: true # required for MinIO; set false for AWS S3
  create_bucket: true
  tls: { ca_file: null }
  presign_expires: 15m

backups:
  destination: directory # directory | storage
  directory: /var/lib/qtiauth/backups
  retention: 35d
