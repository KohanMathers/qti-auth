name = "qti-auth"
main = "worker.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "qti_auth"
database_id = "YOUR_D1_DATABASE_ID"

[vars]
ENVIRONMENT = "production"
FRONTEND_URL = "https://account.quietterminal.co.uk"
API_URL = "https://auth.quietterminal.co.uk"
COOKIE_DOMAIN = ".quietterminal.co.uk"
OAUTH_REDIRECT_URI = "https://auth.quietterminal.co.uk/auth/oauth/callback"
BRAND_NAME = "QTI"
COMPANY_NAME = "Quiet Terminal Interactive"
SECURITY_SENDER_NAME = "QTI Security"
SECURITY_SENDER_EMAIL = "security@account.quietterminal.co.uk"
AUTH_SENDER_NAME = "QTI Auth"
AUTH_SENDER_EMAIL = "auth@account.quietterminal.co.uk"
SERVICE_DOCUMENTATION_URL = "https://quietterminal.co.uk/docs/oauth"
CORS_ORIGINS = "https://account.quietterminal.co.uk,https://account-staging.quietterminal.co.uk,https://support.quietterminal.co.uk,https://support-staging.quietterminal.co.uk"

[[routes]]
pattern = "auth.quietterminal.co.uk/*"
zone_name = "quietterminal.co.uk"

[build]
command = "npm install"

[triggers]
crons = ["0 3 * * *"]

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[env.staging]
name = "qti-auth-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "qti_auth_staging"
database_id = "YOUR_STAGING_D1_DATABASE_ID"

[env.staging.vars]
ENVIRONMENT = "staging"
FRONTEND_URL = "https://account-staging.quietterminal.co.uk"
API_URL = "https://auth-staging.quietterminal.co.uk"
COOKIE_DOMAIN = ".quietterminal.co.uk"
OAUTH_REDIRECT_URI = "https://auth-staging.quietterminal.co.uk/auth/oauth/callback"
BRAND_NAME = "QTI"
COMPANY_NAME = "Quiet Terminal Interactive"
SECURITY_SENDER_NAME = "QTI Security"
SECURITY_SENDER_EMAIL = "security@account.quietterminal.co.uk"
AUTH_SENDER_NAME = "QTI Auth"
AUTH_SENDER_EMAIL = "auth@account.quietterminal.co.uk"
SERVICE_DOCUMENTATION_URL = "https://quietterminal.co.uk/docs/oauth"
CORS_ORIGINS = "https://account.quietterminal.co.uk,https://account-staging.quietterminal.co.uk,https://support.quietterminal.co.uk,https://support-staging.quietterminal.co.uk"

[[env.staging.routes]]
pattern = "auth-staging.quietterminal.co.uk/*"
zone_name = "quietterminal.co.uk"
