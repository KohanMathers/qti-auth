x-dev-service: &dev-service
  environment:
    QTIAUTH_CONFIG: config/qtiauth.dev.yaml

services:
  postgres:
    ports: ['127.0.0.1:5432:5432']

  valkey:
    ports: ['127.0.0.1:6379:6379']

  nats:
    ports: ['127.0.0.1:4222:4222', '127.0.0.1:8222:8222']

  gateway: *dev-service
  notifier: *dev-service
  scheduler: *dev-service
  oidc: *dev-service
  safety: *dev-service
  support: *dev-service
  games: *dev-service

networks:
  internal:
    internal: false
