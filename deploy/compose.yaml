name: qtiauth

x-empty: &empty
  image: alpine:3.24
  command: ['sleep', 'infinity']
  init: true
  read_only: true
  user: '65534:65534'
  cap_drop: [ALL]

x-qtiauth-service: &qtiauth-service
  <<: *empty
  networks: [internal]
  env_file: ../.env
  volumes:
    - ../config:/srv/app/config:ro
  depends_on:
    postgres: { condition: service_healthy }
    valkey: { condition: service_healthy }
    nats: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: qtiauth
    volumes:
      - postgres:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'qtiauth']
      interval: 10s
      timeout: 5s
      start_period: 30s
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.1.2-alpine3.24
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    networks: [internal]
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped

  nats:
    image: nats:2.14.7-alpine3.22
    command: ['--jetstream', '--store_dir', '/data', '--http_port', '8222']
    volumes:
      - nats:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz?js-enabled-only=true']
      interval: 10s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped

  gateway:
    <<: *qtiauth-service
    image: qtiauth/gateway:dev
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    command: ['node', 'src/main.ts']
    networks: [internal, public]
    ports: ['8000:8000']
    volumes:
      - ../config:/srv/app/config:ro
      - geoip:/var/lib/qtiauth/geoip:ro

  identity:
    <<: *qtiauth-service
    image: qtiauth/identity:dev
    build:
      context: ..
      dockerfile: services/identity/Dockerfile
    command: ['node', 'src/main.ts']
    volumes:
      - ../config:/srv/app/config:ro
      - geoip:/var/lib/qtiauth/geoip:ro
      - backups:/var/lib/qtiauth/backups

  notifier:
    <<: *qtiauth-service
    image: qtiauth/notifier:dev
    build:
      context: ..
      dockerfile: services/notifier/Dockerfile
    command: ['node', 'src/main.ts']

  scheduler:
    <<: *qtiauth-service
    image: qtiauth/scheduler:dev
    build:
      context: ..
      dockerfile: services/scheduler/Dockerfile
    command: ['node', 'src/main.ts']

  oidc:
    <<: *qtiauth-service
    image: qtiauth/oidc:dev
    build:
      context: ..
      dockerfile: services/oidc/Dockerfile
    command: ['node', 'src/main.ts']
    profiles: [oidc]

  safety:
    <<: *qtiauth-service
    image: qtiauth/safety:dev
    build:
      context: ..
      dockerfile: services/safety/Dockerfile
    command: ['node', 'src/main.ts']
    profiles: [safety]

  support:
    <<: *qtiauth-service
    image: qtiauth/support:dev
    build:
      context: ..
      dockerfile: services/support/Dockerfile
    command: ['node', 'src/main.ts']
    profiles: [support]

  games:
    <<: *qtiauth-service
    image: qtiauth/games:dev
    build:
      context: ..
      dockerfile: services/games/Dockerfile
    command: ['node', 'src/main.ts']
    profiles: [games]

  minio:
    image: elestio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      start_period: 10s
    profiles: [storage]
    restart: unless-stopped

  geoip-updater:
    image: qtiauth/geoip-updater:dev
    build:
      context: ..
      dockerfile: deploy/geoip-updater/Dockerfile
    volumes:
      - geoip:/var/lib/qtiauth/geoip
    networks: [public]
    profiles: [geoip]
    tmpfs: [/tmp]
    read_only: true
    cap_drop: [ALL]
    restart: unless-stopped

  caddy:
    image: caddy:2.11.1-alpine
    command: ['caddy', 'run', '--config', '/etc/caddy/Caddyfile']
    environment:
      EDGE_HOSTS: ${EDGE_HOSTS:?Set EDGE_HOSTS in .env}
      EDGE_ACME_EMAIL: ${EDGE_ACME_EMAIL:?Set EDGE_ACME_EMAIL in .env}
    volumes:
      - ../deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal, public]
    ports: ['80:80', '443:443', '443:443/udp']
    depends_on:
      gateway: { condition: service_started }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 5s
      start_period: 15s
    profiles: [edge]
    restart: unless-stopped

  backup:
    <<: *qtiauth-service
    image: qtiauth/backup:dev
    build:
      context: ..
      dockerfile: services/backup/Dockerfile
    command: ['node', 'src/main.ts']
    volumes:
      - ../config:/srv/app/config:ro
      - backups:/var/lib/qtiauth/backups
    profiles: [backup]

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    volumes:
      - ../deploy/observability/prometheus:/etc/prometheus:ro
      - prometheus:/prometheus
    networks: [internal]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:9090/-/ready']
      interval: 10s
      timeout: 5s
      start_period: 15s
    profiles: [observability]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ../deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    networks: [internal]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      start_period: 20s
    depends_on:
      prometheus: { condition: service_healthy }
    profiles: [observability]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.9.0
    command: ['-config.file=/etc/tempo/tempo.yaml']
    volumes:
      - ../deploy/observability/tempo:/etc/tempo:ro
      - tempo:/var/tempo
    networks: [internal]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3200/ready']
      interval: 10s
      timeout: 5s
      start_period: 15s
    profiles: [observability]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.0
    command: ['-config.file=/etc/loki/loki.yaml']
    volumes:
      - ../deploy/observability/loki:/etc/loki:ro
      - loki:/loki
    networks: [internal]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3100/ready']
      interval: 10s
      timeout: 5s
      start_period: 15s
    profiles: [observability]
    restart: unless-stopped

networks:
  internal:
    internal: true
  public: {}

volumes:
  postgres:
  nats:
  geoip:
  minio:
  backups:
  caddy_data:
  caddy_config:
  prometheus:
  grafana:
  tempo:
  loki:
