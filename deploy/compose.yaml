name: qtiauth

x-empty: &empty
  image: alpine:3.24
  command: ['sleep', 'infinity']
  init: true
  read_only: true
  user: '65534:65534'
  cap_drop: [ALL]

x-placeholder: &placeholder
  <<: *empty
  network_mode: none

x-qtiauth-service: &qtiauth-service
  <<: *empty
  networks: [internal]
  env_file: ../.env
  volumes:
    - ../config:/srv/app/config:ro
  depends_on:
    postgres: { condition: service_healthy }
    valkey: { condition: service_healthy }
    nats: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: qtiauth
    volumes:
      - postgres:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'qtiauth']
      interval: 10s
      timeout: 5s
      start_period: 30s
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.1.2-alpine3.24
    command: ['valkey-server', '--save', '', '--appendonly', 'no']
    networks: [internal]
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 10s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped

  nats:
    image: nats:2.14.7-alpine3.22
    command: ['--jetstream', '--store_dir', '/data', '--http_port', '8222']
    volumes:
      - nats:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8222/healthz?js-enabled-only=true']
      interval: 10s
      timeout: 5s
      start_period: 10s
    restart: unless-stopped

  gateway:
    <<: *qtiauth-service
    image: qtiauth/gateway:dev
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    command: ['node', 'src/main.ts']
    networks: [internal, public]
    ports: ['8000:8000']
    volumes:
      - ../config:/srv/app/config:ro
      - geoip:/var/lib/qtiauth/geoip:ro

  identity:
    <<: *qtiauth-service
    image: qtiauth/identity:dev
    build:
      context: ..
      dockerfile: services/identity/Dockerfile
    command: ['node', 'src/main.ts']
    volumes:
      - ../config:/srv/app/config:ro
      - geoip:/var/lib/qtiauth/geoip:ro
      - backups:/var/lib/qtiauth/backups

  notifier:
    <<: *qtiauth-service
    image: qtiauth/notifier:dev
    build:
      context: ..
      dockerfile: services/notifier/Dockerfile
    command: ['node', 'src/main.ts']

  scheduler:
    <<: *qtiauth-service
    image: qtiauth/scheduler:dev
    build:
      context: ..
      dockerfile: services/scheduler/Dockerfile
    command: ['node', 'src/main.ts']

  oidc:
    <<: *qtiauth-service
    image: qtiauth/oidc:dev
    build:
      context: ..
      dockerfile: services/oidc/Dockerfile
    command: ['node', 'src/main.ts']
    profiles: [oidc]

  safety:
    <<: *qtiauth-service
    profiles: [safety]

  support:
    <<: *qtiauth-service
    profiles: [support]

  games:
    <<: *qtiauth-service
    profiles: [games]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio:/data
    networks: [internal]
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      start_period: 10s
    profiles: [storage]
    restart: unless-stopped

  geoip-updater:
    image: qtiauth/geoip-updater:dev
    build:
      context: ..
      dockerfile: deploy/geoip-updater/Dockerfile
    volumes:
      - geoip:/var/lib/qtiauth/geoip
    networks: [public]
    profiles: [geoip]
    tmpfs: [/tmp]
    read_only: true
    cap_drop: [ALL]
    restart: unless-stopped

  caddy:
    <<: *placeholder
    profiles: [edge]

  backup:
    <<: *placeholder
    profiles: [backup]

  prometheus:
    <<: *placeholder
    profiles: [observability]

  grafana:
    <<: *placeholder
    profiles: [observability]

  tempo:
    <<: *placeholder
    profiles: [observability]

  loki:
    <<: *placeholder
    profiles: [observability]

networks:
  internal:
    internal: true
  public: {}

volumes:
  postgres:
  nats:
  geoip:
  minio:
  backups:
