<h2 data-t="routes.support.staff.kb.article.title" data-field="title">Article</h2>

<div data-slot="article">
  <form data-form="article" data-state="ready" novalidate>
    <p class="qtiauth-field">
      <label for="qtiauth-f-title" data-t="field.title">Title</label>
      <input
        id="qtiauth-f-title"
        name="title"
        type="text"
        autocomplete="off"
        data-bind-value="title"
        required
      />
    </p>
    <p class="qtiauth-field">
      <label for="qtiauth-f-slug" data-t="field.slug">Slug</label>
      <input
        id="qtiauth-f-slug"
        name="slug"
        type="text"
        autocomplete="off"
        data-bind-value="slug"
        required
      />
    </p>
    <p class="qtiauth-field">
      <label for="qtiauth-f-body" data-t="field.body">Body</label>
      <input
        id="qtiauth-f-body"
        name="body"
        type="text"
        autocomplete="off"
        data-bind-value="body"
        required
      />
    </p>
    <p class="qtiauth-actions">
      <button type="submit" data-t="support.staff.kb.article.submit">Save article</button>
    </p>
    <template data-message="success">
      <p class="qtiauth-success" role="status" data-t="support.staff.kb.article.success">
        Article saved.
      </p>
    </template>
  </form>
  <p class="qtiauth-empty" data-state="missing" data-t="support.staff.kb.missing">
    That article is not available.
  </p>
  <p class="qtiauth-empty" data-state="error" data-t="support.staff.kb.article.load.error">
    Could not load article.
  </p>
</div>

<h3 data-t="support.staff.kb.revisions">Revisions</h3>
<div data-slot="revisions">
  <ul class="qtiauth-list" data-state="list">
    <template data-item="revisions">
      <li>
        <span
          >r<span data-field="revision"></span> — <span data-field="title"></span> —
          <span data-field="created_at"></span
        ></span>
        <button type="button" data-action="restore" data-t="support.staff.kb.revisions.restore">
          Restore
        </button>
      </li>
    </template>
  </ul>
  <p class="qtiauth-empty" data-state="empty" data-t="support.staff.kb.revisions.empty">
    No revisions yet.
  </p>
  <p class="qtiauth-empty" data-state="error" data-t="support.staff.kb.revisions.load.error">
    Could not load revisions.
  </p>
</div>
