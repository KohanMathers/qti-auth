      <a class="qt-brand" href="/" data-link><span class="qt-brand__name" data-field="product_name"></span></a>

        <a href="/account" data-link>Account</a>
        <a href="/support" data-link data-current="page">Support</a>
      </nav>
      <div class="qt-app-nav__user qt-cluster">
        <button class="qt-theme-toggle" type="button" data-action="toggle-theme" aria-label="Toggle theme">
    <svg class="qt-theme-toggle__sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
    <svg class="qt-theme-toggle__moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>
        <details class="qt-user-menu">
          <summary><span class="qt-avatar" data-field="initials"></span><span data-field="username"></span></summary>
          <ul>
            <li><a href="/account" data-link>Account</a></li>

    </div>
  </header>

  <div class="qt-app-body qt-container">
    <aside class="qt-app-sidebar" aria-label="Support sections">
      <nav class="qt-nav-list" aria-label="Support sections">
        <a href="/support" data-link>Overview</a>
        <a href="/kb" data-link data-t="support.section.kb">Help centre</a>
        <a href="/kb/search" data-link data-t="support.section.search">Search articles</a>
        <a href="/tickets" data-link data-t="support.section.tickets">Your tickets</a>
        <a href="/tickets/new" data-link data-t="support.section.newTicket">Open a ticket</a>
        <a href="/appeals/new" data-link data-current="page" data-t="support.section.appeal">Appeal a decision</a>
        <a href="/guest/start" data-link data-t="support.section.guest">Guest support</a>
      </nav>
    </aside>

    <section class="qt-app-main qt-stack qt-stack--lg">
      <header>
        <h2 data-t="routes.appeals.title">Appeal a decision</h2>
        <p class="qtiauth-lede" data-t="appeals.lede">Ask for a lock, ban or restriction to be reviewed.</p>
      </header>

      <article class="qt-card">
        <header class="qt-card__header">
          <h3 data-t="appeals.heading">Submit an appeal</h3>
          <p class="qt-text-muted" data-t="appeals.body">A moderator will reply by email.</p>
        </header>
        <div class="qt-card__body">
          <form data-form="appeal" class="qt-form" novalidate>
            <p class="qtiauth-field qt-field">
              <label for="qtiauth-f-action-id" class="qt-label" data-t="field.actionId">Action ID (optional)</label>
              <input
                id="qtiauth-f-action-id"
                class="qt-input"
                name="action_id"
                type="text"
                autocomplete="off"
                data-bind-value="action_id"
              />
              <small class="qt-help" data-t="appeals.actionIdHelp">Find this in the email we sent you.</small>
            </p>
            <p class="qtiauth-field qt-field">
              <label for="qtiauth-f-body" class="qt-label" data-t="field.message">Message</label>
              <textarea
                id="qtiauth-f-body"
                class="qt-textarea"
                name="body"
                rows="6"
                autocomplete="off"
                required
              ></textarea>
            </p>
            <div class="qtiauth-feedback qt-message" aria-live="polite" data-part="form-feedback"></div>
            <p class="qtiauth-actions qt-actions">
              <button type="submit" class="qt-button" data-variant="primary" data-t="appeals.submit">Send appeal</button>
              <a class="qt-button" data-variant="ghost" href="/support" data-link data-t="appeals.cancel">Cancel</a>
            </p>
            <template data-message="success">
              <p class="qtiauth-success qt-message" data-variant="success" role="status" data-t="appeals.success">Appeal submitted.</p>
            </template>
          </form>
        </div>
      </article>
    </section>
  </div>
</div>
