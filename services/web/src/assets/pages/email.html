<h2 data-t="routes.email.title">Change email</h2>
<p class="qtiauth-lede" data-t="email.lede">
  We’ll email a link to the new address to confirm the change, and let your current address know.
</p>

<form data-form="email" novalidate>
  <p class="qtiauth-field">
    <label for="qtiauth-f-email" data-t="field.email.new">New email</label>
    <input id="qtiauth-f-email" name="email" type="email" autocomplete="email" required />
  </p>
  <p class="qtiauth-actions">
    <button type="submit" data-t="email.submit">Change email</button>
  </p>
  <template data-message="success">
    <p class="qtiauth-success" role="status" data-t="email.success">
      Check your new email address to confirm the change.
    </p>
  </template>
</form>
