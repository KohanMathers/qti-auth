<h2 data-t="routes.admin.user.title">User</h2>

<div data-slot="user">
  <p data-state="loading" role="status" data-t="admin.loading">Loading…</p>
  <div data-state="ready">
    <dl class="qtiauth-details">
      <dt data-t="admin.user.email">Email</dt>
      <dd data-field="email"></dd>
      <dt data-t="admin.user.username">Username</dt>
      <dd data-field="username"></dd>
      <dt data-t="admin.user.state">State</dt>
      <dd data-field="state"></dd>
      <dt data-t="admin.user.ageBand">Age band</dt>
      <dd data-field="age_band"></dd>
      <dt data-t="admin.user.dateOfBirth">Date of birth</dt>
      <dd data-field="date_of_birth"></dd>
      <dt data-t="admin.user.lockedUntil">Locked until</dt>
      <dd data-field="locked_until"></dd>
      <dt data-t="admin.user.roles">Roles</dt>
      <dd data-field="roles"></dd>
      <dt data-t="admin.user.created">Created</dt>
      <dd data-field="created"></dd>
    </dl>

    <h3 data-t="admin.user.actions">Actions</h3>
    <p class="qtiauth-field" data-part="reason">
      <label for="qtiauth-f-reason" data-t="admin.reason">Reason (recorded in the audit log)</label>
      <input id="qtiauth-f-reason" name="reason" type="text" autocomplete="off" maxlength="500" />
    </p>
    <p class="qtiauth-field" data-part="lock-until">
      <label for="qtiauth-f-lock-until" data-t="admin.user.lockUntil">Lock until</label>
      <input id="qtiauth-f-lock-until" name="lock_until" type="datetime-local" />
    </p>
    <p class="qtiauth-actions">
      <button type="button" data-action="lock" data-t="admin.user.lock">Lock</button>
      <button type="button" data-action="unlock" data-t="admin.user.unlock">Unlock</button>
      <button
        type="button"
        class="qtiauth-button qtiauth-button-danger"
        data-action="ban"
        data-t="admin.user.ban"
      >
        Ban
      </button>
      <button type="button" data-action="unban" data-t="admin.user.unban">Unban</button>
      <button type="button" data-action="reauth" data-t="admin.user.reauth">
        Force sign-in again
      </button>
      <button type="button" data-action="revoke-sessions" data-t="admin.user.revokeSessions">
        Sign out everywhere
      </button>
      <button type="button" data-action="username-reset" data-t="admin.user.usernameReset">
        Reset username
      </button>
    </p>
    <div class="qtiauth-feedback" aria-live="polite" data-part="actions-feedback"></div>

    <h3 data-t="admin.user.methods">Sign-in methods</h3>
    <ul class="qtiauth-list">
      <template data-item="methods">
        <li data-field="label"></li>
      </template>
    </ul>
    <h3 data-t="admin.user.sessions">Sessions</h3>
    <ul class="qtiauth-list">
      <template data-item="sessions">
        <li data-field="label"></li>
      </template>
    </ul>
    <h3 data-t="admin.user.entitlements">Games</h3>
    <ul class="qtiauth-list">
      <template data-item="entitlements">
        <li><a href="/admin" data-link data-bind-href="path" data-field="label"></a></li>
      </template>
    </ul>
    <h3 data-t="admin.user.history">Staff actions</h3>
    <ul class="qtiauth-list">
      <template data-item="history">
        <li data-field="label"></li>
      </template>
    </ul>
  </div>
  <p class="qtiauth-empty" data-state="error" data-t="admin.load.error">Could not load data.</p>
</div>
