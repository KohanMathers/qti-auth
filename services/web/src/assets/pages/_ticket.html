<p class="qtiauth-muted">
  <span data-field="status"></span> — <span data-field="priority"></span> —
  <span data-field="created_at"></span>
</p>

<ol class="qtiauth-thread">
  <template data-item="messages">
    <li data-bind-class="class">
      <p class="qtiauth-muted">
        <span data-show="staff" data-t="tickets.staff">Staff</span
        ><span data-show="!staff" data-t="tickets.you">You</span> —
        <span data-field="created_at"></span>
      </p>
      <p data-field="body"></p>
    </li>
  </template>
</ol>

<section data-show="attachments">
  <h3 data-t="tickets.attachments">Attachments</h3>
  <ul class="qtiauth-list">
    <template data-item="attachments">
      <li>
        <span><span data-field="filename"></span> (<span data-field="content_type"></span>)</span>
        <button type="button" data-action="download" data-t="tickets.download">Download</button>
      </li>
    </template>
  </ul>
</section>

<section data-show="open">
  <h3 data-t="tickets.reply.heading">Reply</h3>
  <form data-form="reply" novalidate>
    <p class="qtiauth-field">
      <label for="qtiauth-f-reply" data-t="field.message">Message</label>
      <input id="qtiauth-f-reply" name="body" type="text" autocomplete="off" required />
    </p>
    <p class="qtiauth-actions">
      <button type="submit" data-t="tickets.reply.submit">Send reply</button>
    </p>
    <template data-message="success">
      <p class="qtiauth-success" role="status" data-t="tickets.reply.success">Reply sent.</p>
    </template>
  </form>
  <button
    type="button"
    class="qtiauth-button qtiauth-button-ghost"
    data-action="close"
    data-t="tickets.close"
  >
    Close ticket
  </button>
</section>

<section data-show="!open">
  <button type="button" data-action="reopen" data-t="tickets.reopen">Reopen ticket</button>
  <section data-show="unrated">
    <h3 data-t="tickets.rate.heading">Rate this ticket</h3>
    <div class="qtiauth-actions">
      <button type="button" data-action="rate" value="1">1</button>
      <button type="button" data-action="rate" value="2">2</button>
      <button type="button" data-action="rate" value="3">3</button>
      <button type="button" data-action="rate" value="4">4</button>
      <button type="button" data-action="rate" value="5">5</button>
    </div>
  </section>
</section>

<div data-part="errors"></div>
