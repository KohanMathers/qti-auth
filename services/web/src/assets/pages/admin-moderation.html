<div class="qt-admin-shell">
  <aside class="qt-admin-sidebar" aria-label="Admin">
    <a class="qt-brand qt-brand--compact" href="/admin" data-link>
      <span data-field="product_name"></span>
    </a>
    <nav class="qt-nav-list" aria-label="Admin sections">
      <a href="/admin/users" data-link>Users</a>
      <a href="/admin/moderation" data-link data-current="page">Moderation</a>
      <a href="/admin/appeals" data-link>Appeals</a>
      <a href="/admin/csea" data-link>CSEA</a>
      <a href="/admin/audit" data-link>Audit</a>
    </nav>
  </aside>

  <div class="qt-admin-content">
    <header class="qt-admin-topbar">
      <nav class="qt-breadcrumb" aria-label="Breadcrumb">
        <ol>
          <li><a href="/admin" data-link>Admin</a></li>
          <li aria-current="page">Moderation</li>
        </ol>
      </nav>
      <div class="qt-admin-topbar__actions qt-cluster">
        <button class="qt-theme-toggle" type="button" data-action="toggle-theme" aria-label="Toggle theme"></button>
      </div>
    </header>

    <main class="qt-admin-main qt-stack qt-stack--lg">
      <header class="qt-stack qt-stack--sm">
        <h2 data-t="routes.admin.moderation.title">Moderation queue</h2>
        <p class="qtiauth-lede" data-t="admin.moderation.lede">
          Reports sorted by priority. Take a case to assign it to yourself.
        </p>
      </header>

      <div data-slot="rows">
        <div class="qt-table-wrap" data-state="list">
          <table class="qt-table" data-variant="hoverable" data-size="md">
            <thead>
              <tr>
                <th scope="col" data-t="admin.moderation.col.priority">Priority</th>
                <th scope="col" data-t="admin.moderation.col.kind">Case type</th>
                <th scope="col" data-t="admin.moderation.col.target">Reported</th>
                <th scope="col" data-t="admin.moderation.col.received">Received</th>
                <th scope="col" data-t="admin.moderation.col.sla">SLA</th>
                <th scope="col" class="qt-table__actions" data-t="admin.moderation.col.actions">Actions</th>
              </tr>
            </thead>
            <tbody>
              <template data-item="rows">
                <tr>
                  <td>
                    <span class="qt-badge" data-variant="danger" data-field="priority"></span>
                  </td>
                  <td>
                    <a
                      href="/admin/moderation"
                      data-link
                      data-bind-href="path"
                      data-field="kind"
                    ></a>
                  </td>
                  <td><span data-field="target"></span></td>
                  <td><span class="qt-text-muted" data-field="created"></span></td>
                  <td><span class="qt-badge" data-variant="warning" data-field="sla"></span></td>
                  <td class="qt-table__actions">
                    <a
                      class="qt-button"
                      data-variant="primary"
                      data-size="sm"
                      data-link
                      data-bind-href="path"
                      data-action="take"
                      data-t="admin.moderation.take"
                      href="/admin/moderation"
                    >Take</a>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <div class="qt-empty-state" data-state="empty">
          <h3 class="qt-empty-state__title" data-t="admin.empty">Nothing to show.</h3>
          <p class="qt-empty-state__desc" data-t="admin.moderation.empty.desc">
            The queue is clear. New reports will appear here.
          </p>
        </div>
        <p class="qt-message" data-variant="danger" data-state="error" role="alert" data-t="admin.load.error">
          Could not load data.
        </p>
      </div>
    </main>
  </div>
</div>
