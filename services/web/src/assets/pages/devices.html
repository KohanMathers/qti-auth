<div class="qt-app-shell">
  <header class="qt-app-nav" role="banner">
    <div class="qt-app-nav__inner qt-container">
      <a class="qt-brand" href="/" data-link><span class="qt-brand__name" data-field="product_name"></span></a>
      <nav class="qt-app-nav__links" aria-label="Primary">
        <a href="/games" data-link data-current="page">Games</a>
        <a href="/account" data-link>Account</a>
        <a href="/support" data-link>Support</a>
      </nav>
      <div class="qt-app-nav__user qt-cluster">
        <button class="qt-theme-toggle" type="button" data-action="toggle-theme" aria-label="Toggle theme"></button>
        <details class="qt-user-menu">
          <summary><span class="qt-avatar" data-field="initials"></span><span data-field="username"></span></summary>
          <ul>
            <li><a href="/account" data-link>Account</a></li>
            <li><button type="button" data-action="sign-out" data-t="account.signOut">Sign out</button></li>
          </ul>
        </details>
      </div>
    </div>
  </header>

  <div class="qt-app-body qt-container">
    <aside class="qt-app-sidebar" aria-label="Games sections">
      <nav class="qt-nav-list" aria-label="Games sections">
        <a href="/games" data-link data-t="games.section.library">Library</a>
        <a href="/games/redeem" data-link data-t="games.section.redeem">Redeem a key</a>
        <a href="/games/achievements" data-link data-t="games.section.achievements">Achievements</a>
        <a href="/games/stats" data-link data-t="games.section.stats">Stats</a>
        <a href="/games/leaderboards" data-link data-t="games.section.leaderboards">Leaderboards</a>
        <a href="/games/devices" data-link data-current="page" data-t="games.section.devices">Devices</a>
      </nav>
    </aside>

    <section class="qt-app-main qt-stack qt-stack--lg">
      <header>
        <h2 data-t="routes.devices.title">Game devices</h2>
        <p class="qtiauth-lede qt-prose__lede" data-t="devices.lede">Devices that can play your games offline.</p>
      </header>

      <form class="qt-form qt-stack" data-form="game" novalidate>
        <p class="qtiauth-field qt-form-group">
          <label for="qtiauth-f-game" data-t="field.game">Game</label>
          <select id="qtiauth-f-game" name="game" required>
            <template data-item="games">
              <option data-bind-value="slug" data-field="name"></option>
            </template>
          </select>
        </p>
        <p class="qtiauth-actions qt-actions">
          <button type="submit" class="qt-button" data-variant="primary" data-t="games.load">Load</button>
        </p>
      </form>

      <div data-slot="devices">
        <ul class="qtiauth-list qt-stack qt-stack--sm" data-state="list">
          <template data-item="devices">
            <li class="qt-card qt-card--plain">
              <span data-t="devices.item">{name}, last seen {last_seen}</span>
              <button type="button" class="qt-button" data-variant="ghost" data-size="sm" data-action="revoke" data-t="devices.revoke">Revoke</button>
            </li>
          </template>
        </ul>
        <p class="qtiauth-empty qt-empty-state" data-state="empty" data-t="devices.empty">No linked devices.</p>
        <p class="qtiauth-empty qt-message" data-variant="danger" data-state="error" role="alert" data-t="devices.load.error">
          Could not load devices.
        </p>
      </div>
    </section>
  </div>
</div>
