<div class="qt-admin-shell">
  <aside class="qt-admin-sidebar" aria-label="Admin">
    <a class="qt-brand qt-brand--compact" href="/admin" data-link>
      <span class="qt-brand__name" data-field="product_name"></span>
    </a>
    <nav class="qt-nav-list" aria-label="Admin sections">
      <a href="/admin" data-link data-t="admin.section.overview">Overview</a>
      <a href="/admin/users" data-link data-t="admin.section.users">Users</a>
      <a href="/admin/roles" data-link data-t="admin.section.roles">Roles</a>
      <a href="/admin/audit" data-link data-t="admin.section.audit">Audit log</a>
      <a href="/admin/webhooks" data-link data-t="admin.section.webhooks">Webhooks</a>
      <a href="/admin/filter" data-link data-t="admin.section.filter">Text filter tuning</a>
      <a href="/admin/moderation" data-link data-t="admin.section.moderation">Moderation queue</a>
      <a href="/admin/appeals" data-link data-t="admin.section.appeals">Appeals</a>
      <a href="/admin/csea" data-link data-t="admin.section.csea">CSEA cases</a>
      <a href="/admin/oauth" data-link data-t="admin.section.oauth">OAuth client verification</a>
      <a href="/admin/games" data-link data-t="admin.section.games">Games catalog</a>
      <a href="/admin/health" data-link data-current="page" data-t="admin.section.health">Service health</a>
    </nav>
  </aside>

  <div class="qt-admin-content">
    <header class="qt-admin-topbar">
      <nav class="qt-breadcrumb" aria-label="Breadcrumb">
        <ol>
          <li><a href="/admin" data-link data-t="routes.admin.title">Admin</a></li>
          <li aria-current="page" data-t="routes.admin.health.title">Service health</li>
        </ol>
      </nav>
      <div class="qt-admin-topbar__actions qt-cluster">
        <button class="qt-theme-toggle" type="button" data-action="toggle-theme" aria-label="Toggle theme"></button>
      </div>
    </header>

    <main class="qt-admin-main qt-stack qt-stack--lg">
      <header>
        <h2 data-t="routes.admin.health.title">Service health</h2>
        <p class="qtiauth-lede" data-t="admin.health.status">Overall: {status}</p>
      </header>

      <article class="qt-card qt-health-summary">
        <header class="qt-card__header">
          <h3 data-t="admin.health.summary.heading">Summary</h3>
        </header>
        <div class="qt-card__body qt-cluster">
          <span class="qt-badge" data-variant="success" data-field="overall_status">OK</span>
          <span class="qt-text-muted qt-text-small" data-field="checked_at"></span>
        </div>
      </article>

      <section aria-label="Service status cards">
        <div data-slot="services">
          <div class="qt-status-grid" data-state="list">
            <template data-item="services">
              <article class="qt-card qt-status-card">
                <header class="qt-card__header qt-cluster">
                  <h3 data-field="name"></h3>
                  <span class="qt-badge" data-variant="neutral" data-field="status"></span>
                </header>
                <div class="qt-card__body">
                  <dl class="qtiauth-details">
                    <dt data-t="admin.health.card.instances">Instances</dt>
                    <dd data-field="instances"></dd>
                    <dt data-t="admin.health.card.version">Version</dt>
                    <dd data-field="version"></dd>
                    <dt data-t="admin.health.card.uptime">Uptime</dt>
                    <dd data-field="uptime"></dd>
                    <dt data-t="admin.health.card.lastCheck">Last check</dt>
                    <dd data-field="last_check"></dd>
                  </dl>
                  <p class="qtiauth-muted" data-t="admin.health.service">{name}: {instances} running</p>
                </div>
              </article>
            </template>
          </div>
          <p class="qtiauth-empty" data-state="empty" data-t="admin.health.empty">
            No services are running.
          </p>
          <p class="qtiauth-empty" data-state="error" data-t="admin.load.error">Could not load data.</p>
        </div>
      </section>
    </main>
  </div>
</div>
