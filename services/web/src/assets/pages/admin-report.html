<h2 data-t="routes.admin.report.title">Report</h2>

<div data-slot="report">
  <p data-state="loading" role="status" data-t="admin.loading">Loading…</p>
  <div data-state="ready">
    <dl class="qtiauth-details">
      <dt data-t="admin.report.kind">Type</dt>
      <dd data-field="kind"></dd>
      <dt data-t="admin.report.priority">Priority</dt>
      <dd data-field="priority"></dd>
      <dt data-t="admin.report.status">Status</dt>
      <dd data-field="status"></dd>
      <dt data-t="admin.report.source">Source</dt>
      <dd data-field="source"></dd>
      <dt data-t="admin.report.target">Reported</dt>
      <dd data-field="target"></dd>
      <dt data-t="admin.report.note">Note</dt>
      <dd data-field="note"></dd>
      <dt data-t="admin.report.snapshot">Snapshot</dt>
      <dd data-field="snapshot"></dd>
      <dt data-t="admin.report.created">Received</dt>
      <dd data-field="created"></dd>
      <dt data-t="admin.report.sla">Respond by</dt>
      <dd data-field="sla"></dd>
      <dt data-t="admin.report.outcome">Outcome</dt>
      <dd data-field="outcome"></dd>
    </dl>
    <p>
      <a
        href="/admin/moderation"
        data-link
        data-bind-href="target_path"
        data-t="admin.report.targetLink"
        >Open the reported user</a
      >
    </p>
    <h3 data-t="admin.report.history">Actions taken</h3>
    <ul class="qtiauth-list">
      <template data-item="actions">
        <li data-field="label"></li>
      </template>
    </ul>
  </div>
  <p class="qtiauth-empty" data-state="error" data-t="admin.load.error">Could not load data.</p>
</div>

<h3 data-t="admin.report.act">Take action</h3>
<form data-form="act" novalidate>
  <p class="qtiauth-field">
    <label for="qtiauth-f-action" data-t="admin.report.action">Action</label>
    <select id="qtiauth-f-action" name="action" required>
      <template data-item="action-options">
        <option data-bind-value="value" data-field="label"></option>
      </template>
    </select>
  </p>
  <p class="qtiauth-field">
    <label for="qtiauth-f-rule" data-t="admin.report.rule">Rule broken</label>
    <select id="qtiauth-f-rule" name="rule_id" required>
      <template data-item="rule-options">
        <option data-bind-value="value" data-field="label"></option>
      </template>
    </select>
  </p>
  <p class="qtiauth-field">
    <label for="qtiauth-f-expires" data-t="admin.report.expires">Ends (optional)</label>
    <input id="qtiauth-f-expires" name="expires_at" type="datetime-local" />
  </p>
  <p class="qtiauth-actions">
    <button type="submit" data-t="admin.report.submit">Apply</button>
  </p>
  <template data-message="success">
    <p class="qtiauth-success" role="status" data-t="admin.report.applied">Action recorded.</p>
  </template>
</form>
<button
  type="button"
  class="qtiauth-button qtiauth-button-ghost"
  data-action="dismiss"
  data-t="admin.report.dismiss"
>
  Dismiss report
</button>
<div class="qtiauth-feedback" aria-live="polite" data-part="act-feedback"></div>
