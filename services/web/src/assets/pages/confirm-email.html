<div class="qt-auth-shell">
  <button class="qt-theme-toggle" type="button" data-action="toggle-theme" aria-label="Toggle theme"></button>
  <section class="qt-auth-card" aria-labelledby="qt-confirm-email-title">
    <header class="qt-auth-card__header">
      <a class="qt-brand" href="/" data-link><span class="qt-brand__name" data-field="product_name"></span></a>
    </header>
    <div class="qt-auth-card__body qt-stack qt-stack--lg">
      <header>
        <h1 id="qt-confirm-email-title" data-t="routes.confirm-email.title">Confirm your new email</h1>
        <p class="qt-prose__lede" data-t="confirmEmail.lede">
          Confirm the change to finish using this address on your account.
        </p>
      </header>

      <form data-form="confirm" class="qt-form" novalidate>
        <p class="qt-form-group">
          <label class="qt-label" for="qtiauth-f-token" data-t="field.token">Code</label>
          <input
            class="qt-input"
            id="qtiauth-f-token"
            name="token"
            type="text"
            autocomplete="one-time-code"
            data-bind-value="token"
            required
          />
        </p>
        <p class="qt-actions">
          <button type="submit" class="qt-button" data-variant="primary" data-t="confirmEmail.submit">Confirm email</button>
        </p>
        <template data-message="success">
          <p class="qt-message" data-variant="success" role="status" data-t="confirmEmail.success">
            Your email address is now {email}.
          </p>
        </template>
      </form>
    </div>
    <footer class="qt-auth-card__footer qt-prose">
      <p class="qt-text-muted"><small>&copy; <span data-field="company_name"></span></small></p>
    </footer>
  </section>
</div>
