<div class="qt-auth-shell">
  <button class="qt-theme-toggle" type="button" data-action="toggle-theme" aria-label="Toggle theme">
    <svg class="qt-theme-toggle__sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
    <svg class="qt-theme-toggle__moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>
  <section class="qt-auth-card" aria-labelledby="qt-guest-verify-title">
    <header class="qt-auth-card__header">
      <a class="qt-brand" href="/" data-link>
        <span class="qt-brand__name" data-field="product_name"></span>
      </a>
    </header>

    <div class="qt-auth-card__body qt-stack qt-stack--lg">
      <header>
        <h2 id="qt-guest-verify-title" data-t="routes.guest.verify.title">Open a guest ticket</h2>
        <p class="qtiauth-lede" data-t="guest.verify.lede">
          Fill in your ticket and paste the code we emailed.
        </p>
      </header>

      <form data-form="ticket" class="qt-form" novalidate>
        <p class="qtiauth-field qt-field">
          <label for="qtiauth-f-email" class="qt-label" data-t="field.email">Email</label>
          <input
            id="qtiauth-f-email"
            class="qt-input"
            name="email"
            type="email"
            autocomplete="off"
            data-bind-value="email"
            required
          />
        </p>
        <p class="qtiauth-field qt-field">
          <label for="qtiauth-f-code" class="qt-label" data-t="field.code">Code</label>
          <input
            id="qtiauth-f-code"
            class="qt-input"
            name="code"
            type="text"
            autocomplete="one-time-code"
            required
          />
        </p>
        <p class="qtiauth-field qt-field">
          <label for="qtiauth-f-category" class="qt-label" data-t="field.category">Category</label>
          <select id="qtiauth-f-category" class="qt-select" name="category_id" data-part="categories" required>
            <option value="" data-t="tickets.new.pickCategory">Choose a category</option>
            <template data-item="categories">
              <option data-bind-value="id" data-field="name"></option>
            </template>
          </select>
        </p>
        <p class="qtiauth-field qt-field">
          <label for="qtiauth-f-subject" class="qt-label" data-t="field.subject">Subject</label>
          <input
            id="qtiauth-f-subject"
            class="qt-input"
            name="subject"
            type="text"
            autocomplete="off"
            required
          />
        </p>
        <p class="qtiauth-field qt-field">
          <label for="qtiauth-f-body" class="qt-label" data-t="field.message">Message</label>
          <textarea
            id="qtiauth-f-body"
            class="qt-textarea"
            name="body"
            rows="5"
            autocomplete="off"
            required
          ></textarea>
        </p>
        <div class="qtiauth-feedback qt-message" aria-live="polite" data-part="form-feedback"></div>
        <p class="qtiauth-actions qt-actions">
          <button type="submit" class="qt-button" data-variant="primary" data-t="guest.verify.submit">Open ticket</button>
        </p>
        <template data-message="success">
          <p class="qtiauth-success qt-message" data-variant="success" role="status" data-t="guest.verify.success">Ticket opened.</p>
        </template>
      </form>
    </div>

    <footer class="qt-auth-card__footer qt-prose">
      <p class="qt-text-muted"><small>&copy; <span data-field="company_name"></span></small></p>
    </footer>
  </section>
</div>

<template data-message="categories-error">
  <option value="" disabled data-t="tickets.new.categoryLoadError">
    Could not load categories.
  </option>
</template>
