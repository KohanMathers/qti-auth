<h2 data-t="routes.social-callback.title">Finishing sign-in</h2>

<div data-slot="step">
  <p data-state="loading" role="status" data-t="socialCallback.loading">Signing you in…</p>

  <form data-form="signup" data-state="signup" novalidate>
    <p class="qtiauth-lede" data-t="socialCallback.signup.lede">
      A few more details to create your account.
    </p>
    <p class="qtiauth-field" data-show="needs_email">
      <label for="qtiauth-f-email" data-t="field.email">Email</label>
      <input id="qtiauth-f-email" name="email" type="email" autocomplete="email" required />
    </p>
    <p class="qtiauth-field" data-show="needs_date_of_birth">
      <label for="qtiauth-f-dob" data-t="field.dateOfBirth">Date of birth</label>
      <input id="qtiauth-f-dob" name="date_of_birth" type="date" autocomplete="bday" required />
    </p>
    <p class="qtiauth-field">
      <label for="qtiauth-f-guardian" data-t="field.guardianEmail.optional">
        Parent or guardian email, if you need their permission
      </label>
      <input id="qtiauth-f-guardian" name="guardian_email" type="email" autocomplete="off" />
    </p>
    <p class="qtiauth-actions">
      <button type="submit" data-t="socialCallback.signup.submit">Create account</button>
    </p>
  </form>

  <p data-state="error">
    <a href="/sign-in" data-link data-t="socialCallback.retry">Back to sign in</a>
  </p>
</div>
<div class="qtiauth-feedback" aria-live="polite" data-part="feedback"></div>
