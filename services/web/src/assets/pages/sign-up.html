<div class="qt-auth-shell">
  <button class="qt-theme-toggle" type="button" data-action="toggle-theme" aria-label="Toggle theme">
    <svg class="qt-theme-toggle__sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
    <svg class="qt-theme-toggle__moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>
  <section class="qt-auth-card" aria-labelledby="qt-signup-title">
    <header class="qt-auth-card__header">
      <a class="qt-brand" href="/" data-link><span class="qt-brand__name" data-field="product_name"></span></a>
    </header>
    <div class="qt-auth-card__body qt-stack qt-stack--lg">
      <header>
        <h1 id="qt-signup-title" data-t="routes.sign-up.title">Create an account</h1>
        <p class="qt-prose__lede" data-t="signUp.lede">It takes a minute.</p>
      </header>

      <form data-form="password" data-show="password" class="qt-form" novalidate>
        <p class="qt-form-group">
          <label class="qt-label" for="qtiauth-f-email" data-t="field.email">Email</label>
          <input class="qt-input" id="qtiauth-f-email" name="email" type="email" autocomplete="email" required />
        </p>
        <p class="qt-form-group">
          <label class="qt-label" for="qtiauth-f-password" data-t="field.password">Password</label>
          <input
            class="qt-input"
            id="qtiauth-f-password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="12"
            required
          />
        </p>
        <p class="qt-form-group">
          <label class="qt-label" for="qtiauth-f-dob" data-t="field.dateOfBirth">Date of birth</label>
          <input class="qt-input" id="qtiauth-f-dob" name="date_of_birth" type="date" autocomplete="bday" required />
        </p>
        <p class="qt-form-group" data-part="guardian-group" hidden>
          <label class="qt-label" for="qtiauth-f-guardian" data-t="field.guardianEmail">
            Parent or guardian's email
          </label>
          <input class="qt-input" id="qtiauth-f-guardian" name="guardian_email" type="email" autocomplete="off" />
        </p>
        <p class="qt-actions">
          <button type="submit" class="qt-button" data-variant="primary" data-t="signUp.submit">Create account</button>
        </p>
        <template data-message="success">
          <p class="qt-message" data-variant="success" role="status" data-t="signUp.success">
            Account created. Check your email to verify it.
          </p>
        </template>
      </form>

      <form data-form="magic" data-show="magic_only" class="qt-form" novalidate>
        <p class="qt-form-group">
          <label class="qt-label" for="qtiauth-f-magic-email" data-t="field.email">Email</label>
          <input class="qt-input" id="qtiauth-f-magic-email" name="email" type="email" autocomplete="email" required />
        </p>
        <p class="qt-actions">
          <button type="submit" class="qt-button" data-variant="primary" data-t="signUp.magic.submit">Send me a sign-up link</button>
        </p>
        <template data-message="success">
          <p class="qt-message" data-variant="success" role="status" data-t="signUp.magic.success">
            Check your email to finish signing up.
          </p>
        </template>
      </form>
    </div>
    <footer class="qt-auth-card__footer qt-prose">
      <p class="qt-text-muted"><small>&copy; <span data-field="company_name"></span></small></p>
    </footer>
  </section>
</div>
