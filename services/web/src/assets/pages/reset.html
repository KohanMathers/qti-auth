<h2 data-t="routes.reset.title">Choose a new password</h2>

<div data-slot="step">
  <form data-form="reset" data-state="form" novalidate>
    <p class="qtiauth-lede" data-t="reset.lede">Choose a password of at least 12 characters.</p>
    <p class="qtiauth-field">
      <label for="qtiauth-f-token" data-t="field.token">Code</label>
      <input
        id="qtiauth-f-token"
        name="token"
        type="text"
        autocomplete="one-time-code"
        data-bind-value="token"
        required
      />
    </p>
    <p class="qtiauth-field">
      <label for="qtiauth-f-password" data-t="field.password">Password</label>
      <input
        id="qtiauth-f-password"
        name="password"
        type="password"
        autocomplete="new-password"
        minlength="12"
        required
      />
    </p>
    <p class="qtiauth-field">
      <input id="qtiauth-f-keep" name="keep_other_sessions" type="checkbox" />
      <label for="qtiauth-f-keep" data-t="reset.keepSessions">
        Don’t log me out of other sessions
      </label>
    </p>
    <p class="qtiauth-actions">
      <button type="submit" data-t="reset.submit">Set new password</button>
    </p>
  </form>

  <div data-state="choose">
    <p data-t="reset.choose">This email address has more than one account. Choose one.</p>
    <ul class="qtiauth-list">
      <template data-item="accounts">
        <li>
          <button type="button" data-action="choose" data-t="account.choose">
            Account created {created}
          </button>
        </li>
      </template>
    </ul>
    <div class="qtiauth-feedback" aria-live="polite" data-part="choose-feedback"></div>
  </div>
</div>
