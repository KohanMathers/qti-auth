<div class="qt-auth-shell">
  <button class="qt-theme-toggle" type="button" data-action="toggle-theme" aria-label="Toggle theme"></button>
  <section class="qt-auth-card" aria-labelledby="qt-reset-title">
    <header class="qt-auth-card__header">
      <a class="qt-brand" href="/" data-link><span class="qt-brand__name" data-field="product_name"></span></a>
    </header>
    <div class="qt-auth-card__body qt-stack qt-stack--lg">
      <h1 id="qt-reset-title" data-t="routes.reset.title">Choose a new password</h1>

      <div data-slot="step">
        <form data-form="reset" data-state="form" class="qt-form qt-stack" novalidate>
          <p class="qt-prose__lede" data-t="reset.lede">Choose a password of at least 12 characters.</p>
          <p class="qt-form-group">
            <label class="qt-label" for="qtiauth-f-token" data-t="field.token">Code</label>
            <input
              class="qt-input"
              id="qtiauth-f-token"
              name="token"
              type="text"
              autocomplete="one-time-code"
              data-bind-value="token"
              required
            />
          </p>
          <p class="qt-form-group">
            <label class="qt-label" for="qtiauth-f-password" data-t="field.password">Password</label>
            <input
              class="qt-input"
              id="qtiauth-f-password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="12"
              required
            />
          </p>
          <label class="qt-check">
            <input id="qtiauth-f-keep" name="keep_other_sessions" type="checkbox" />
            <span data-t="reset.keepSessions">Don't log me out of other sessions</span>
          </label>
          <p class="qt-actions">
            <button type="submit" class="qt-button" data-variant="primary" data-t="reset.submit">Set new password</button>
          </p>
        </form>

        <div data-state="choose" class="qt-stack">
          <p data-t="reset.choose">This email address has more than one account. Choose one.</p>
          <ul class="qt-nav-list">
            <template data-item="accounts">
              <li>
                <button type="button" class="qt-button" data-variant="secondary" data-action="choose" data-t="account.choose">
                  Account created {created}
                </button>
              </li>
            </template>
          </ul>
          <div class="qt-message" aria-live="polite" data-part="choose-feedback"></div>
        </div>
      </div>
    </div>
    <footer class="qt-auth-card__footer qt-prose">
      <p class="qt-text-muted"><small>&copy; <span data-field="company_name"></span></small></p>
    </footer>
  </section>
</div>
