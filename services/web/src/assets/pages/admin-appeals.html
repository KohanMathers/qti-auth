<div class="qt-admin-shell">
  <aside class="qt-admin-sidebar" aria-label="Admin">
    <a class="qt-brand qt-brand--compact" href="/admin" data-link>
      <span data-field="product_name"></span>
    </a>
    <nav class="qt-nav-list" aria-label="Admin sections">
      <a href="/admin/users" data-link>Users</a>
      <a href="/admin/moderation" data-link>Moderation</a>
      <a href="/admin/appeals" data-link data-current="page">Appeals</a>
      <a href="/admin/csea" data-link>CSEA</a>
      <a href="/admin/audit" data-link>Audit</a>
    </nav>
  </aside>

  <div class="qt-admin-content">
    <header class="qt-admin-topbar">
      <nav class="qt-breadcrumb" aria-label="Breadcrumb">
        <ol>
          <li><a href="/admin" data-link>Admin</a></li>
          <li aria-current="page">Appeals</li>
        </ol>
      </nav>
      <div class="qt-admin-topbar__actions qt-cluster">
        <button class="qt-theme-toggle" type="button" data-action="toggle-theme" aria-label="Toggle theme">
    <svg class="qt-theme-toggle__sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
    <svg class="qt-theme-toggle__moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>
      </div>
    </header>

    <main class="qt-admin-main qt-stack qt-stack--lg">
      <header class="qt-stack qt-stack--sm">
        <h2 data-t="routes.admin.appeals.title">Appeals</h2>
        <p class="qtiauth-lede" data-t="admin.appeals.lede">
          Review user appeals and resolve them inline.
        </p>
      </header>

      <div data-slot="rows">
        <div class="qt-table-wrap" data-state="list">
          <table class="qt-table" data-variant="zebra" data-size="md">
            <thead>
              <tr>
                <th scope="col" data-t="admin.appeals.col.created">Submitted</th>
                <th scope="col" data-t="admin.appeals.col.user">User</th>
                <th scope="col" data-t="admin.appeals.col.state">State</th>
                <th scope="col" data-t="admin.appeals.col.body">Appeal</th>
                <th scope="col" class="qt-table__actions" data-t="admin.appeals.col.resolve">Resolve</th>
              </tr>
            </thead>
            <tbody>
              <template data-item="rows">
                <tr>
                  <td><span class="qtiauth-muted qt-text-muted" data-field="created"></span></td>
                  <td><span data-field="user"></span></td>
                  <td><span class="qt-badge" data-variant="warning" data-field="state"></span></td>
                  <td><span data-field="body"></span></td>
                  <td class="qt-table__actions">
                    <form data-form="resolve" class="qt-cluster" novalidate>
                      <label class="qt-visually-hidden" data-bind-value="field_id" data-t="admin.appeals.reason.label">Resolution note</label>
                      <input
                        class="qt-input"
                        type="text"
                        name="reason"
                        data-field="reason_placeholder"
                        aria-label="Resolution note"
                      />
                      <button
                        type="submit"
                        class="qtiauth-button qt-button"
                        data-variant="primary"
                        data-size="sm"
                        data-action="lift"
                        data-t="admin.appeals.lift"
                      >Lift</button>
                      <button
                        type="button"
                        class="qtiauth-button qtiauth-button-ghost qt-button"
                        data-variant="ghost"
                        data-size="sm"
                        data-action="uphold"
                        data-t="admin.appeals.uphold"
                      >Uphold</button>
                    </form>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <div class="qt-empty-state" data-state="empty">
          <h3 class="qt-empty-state__title" data-t="admin.appeals.empty">No open appeals.</h3>
          <p class="qt-empty-state__desc" data-t="admin.appeals.empty.desc">
            Resolved appeals move to the audit log.
          </p>
        </div>
        <p class="qt-message" data-variant="danger" data-state="error" role="alert" data-t="admin.load.error">
          Could not load data.
        </p>
      </div>

      <nav class="qt-pagination" aria-label="Pagination" data-slot="pagination">
        <a class="qt-button" data-variant="ghost" data-size="sm" data-link data-bind-href="prev_path" href="?page=1" rel="prev" data-t="admin.pagination.prev">Previous</a>
        <ol>
          <template data-item="pages">
            <li><a data-link data-bind-href="path" data-field="label" href="?page=1"></a></li>
          </template>
        </ol>
        <a class="qt-button" data-variant="ghost" data-size="sm" data-link data-bind-href="next_path" href="?page=2" rel="next" data-t="admin.pagination.next">Next</a>
      </nav>
    </main>
  </div>
</div>
