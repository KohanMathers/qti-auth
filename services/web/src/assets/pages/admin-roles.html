<div class="qt-admin-shell">
  <aside class="qt-admin-sidebar" aria-label="Admin">
    <a class="qt-brand qt-brand--compact" href="/admin" data-link>
      <span class="qt-brand__name" data-field="product_name"></span>
    </a>
    <nav class="qt-nav-list" aria-label="Admin sections">
      <a href="/admin" data-link data-t="admin.section.overview">Overview</a>
      <a href="/admin/users" data-link data-t="admin.section.users">Users</a>
      <a href="/admin/roles" data-link data-current="page" data-t="admin.section.roles">Roles</a>
      <a href="/admin/audit" data-link data-t="admin.section.audit">Audit log</a>
      <a href="/admin/webhooks" data-link data-t="admin.section.webhooks">Webhooks</a>
      <a href="/admin/filter" data-link data-t="admin.section.filter">Text filter tuning</a>
      <a href="/admin/moderation" data-link data-t="admin.section.moderation">Moderation queue</a>
      <a href="/admin/appeals" data-link data-t="admin.section.appeals">Appeals</a>
      <a href="/admin/csea" data-link data-t="admin.section.csea">CSEA cases</a>
      <a href="/admin/oauth" data-link data-t="admin.section.oauth">OAuth client verification</a>
      <a href="/admin/games" data-link data-t="admin.section.games">Games catalog</a>
      <a href="/admin/health" data-link data-t="admin.section.health">Service health</a>
    </nav>
  </aside>

  <div class="qt-admin-content">
    <header class="qt-admin-topbar">
      <nav class="qt-breadcrumb" aria-label="Breadcrumb">
        <ol>
          <li><a href="/admin" data-link data-t="routes.admin.title">Admin</a></li>
          <li aria-current="page" data-t="routes.admin.roles.title">Roles</li>
        </ol>
      </nav>
      <div class="qt-admin-topbar__actions qt-cluster">
        <button class="qt-theme-toggle" type="button" data-action="toggle-theme" aria-label="Toggle theme">
    <svg class="qt-theme-toggle__sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
    <svg class="qt-theme-toggle__moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>
      </div>
    </header>

    <main class="qt-admin-main qt-stack qt-stack--lg">
      <header>
        <h2 data-t="routes.admin.roles.title">Roles</h2>
        <p class="qtiauth-lede" data-t="admin.roles.lede">
          Review each role and the permissions it grants.
        </p>
      </header>

      <article class="qt-card">
        <header class="qt-card__header">
          <h3 data-t="admin.roles.list.heading">All roles</h3>
        </header>
        <div class="qt-card__body">
          <div data-slot="rows">
            <ul class="qtiauth-list qt-stack qt-stack--sm" data-state="list">
              <template data-item="rows">
                <li>
                  <article class="qt-role">
                    <header class="qt-role__header qt-cluster">
                      <h4 data-field="name"></h4>
                      <span class="qt-badge" data-variant="info" data-field="scope"></span>
                    </header>
                    <p class="qt-text-muted qt-text-small" data-field="description"></p>
                    <div class="qt-table-wrap">
                      <table class="qt-table" data-variant="zebra" data-size="sm">
                        <thead>
                          <tr>
                            <th scope="col" data-t="admin.roles.col.permission">Permission</th>
                            <th scope="col" data-t="admin.roles.col.granted">Granted</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template data-item="permissions">
                            <tr>
                              <td data-field="label"></td>
                              <td><span class="qt-badge" data-variant="neutral" data-field="granted"></span></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </article>
                </li>
              </template>
            </ul>
            <p class="qtiauth-empty" data-state="empty" data-t="admin.empty">Nothing to show.</p>
            <p class="qtiauth-empty" data-state="error" data-t="admin.load.error">Could not load data.</p>
          </div>
        </div>
      </article>
    </main>
  </div>
</div>
