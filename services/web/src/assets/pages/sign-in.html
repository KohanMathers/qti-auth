<div class="qt-auth-shell">
  <button class="qt-theme-toggle" type="button" data-action="toggle-theme" aria-label="Toggle theme"></button>
  <section class="qt-auth-card" aria-labelledby="qt-signin-title">
    <header class="qt-auth-card__header">
      <a class="qt-brand" href="/" data-link><span class="qt-brand__name" data-field="product_name"></span></a>
    </header>
    <div class="qt-auth-card__body qt-stack qt-stack--lg">
      <h1 id="qt-signin-title" data-t="routes.sign-in.title">Sign in</h1>

      <div data-slot="step">
        <div data-state="methods" class="qt-stack qt-stack--lg">
          <p class="qt-prose__lede" data-t="signIn.lede">Choose a way to sign in.</p>

          <section data-show="password" class="qt-stack">
            <h2 data-t="signIn.password.heading">Sign in with password</h2>
            <form data-form="password" class="qt-form" novalidate>
              <p class="qt-form-group">
                <label class="qt-label" for="qtiauth-f-email" data-t="field.email">Email</label>
                <input class="qt-input" id="qtiauth-f-email" name="email" type="email" autocomplete="email" required />
              </p>
              <p class="qt-form-group">
                <label class="qt-label" for="qtiauth-f-password" data-t="field.password">Password</label>
                <input
                  class="qt-input"
                  id="qtiauth-f-password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  required
                />
              </p>
              <p class="qt-actions">
                <button type="submit" class="qt-button" data-variant="primary" data-t="signIn.submit">Sign in</button>
              </p>
            </form>
            <p><a href="/forgot" data-link data-t="signIn.forgot">Forgot your password?</a></p>
          </section>

          <section data-show="magic_link" class="qt-stack">
            <h2 data-t="signIn.magic.heading">Sign in with a link</h2>
            <form data-form="magic" class="qt-form" novalidate>
              <p class="qt-form-group">
                <label class="qt-label" for="qtiauth-f-magic-email" data-t="field.email">Email</label>
                <input
                  class="qt-input"
                  id="qtiauth-f-magic-email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  required
                />
              </p>
              <p class="qt-actions">
                <button type="submit" class="qt-button" data-variant="primary" data-t="signIn.magic.submit">Send me a link</button>
              </p>
              <template data-message="success">
                <p class="qt-message" data-variant="success" role="status" data-t="signIn.magic.success">
                  Check your email for a sign-in link.
                </p>
              </template>
            </form>
          </section>

          <section data-show="passkeys" class="qt-stack">
            <h2 data-t="signIn.passkey.heading">Sign in with a passkey</h2>
            <p data-t="signIn.passkey.body">Your device will prompt you to choose a passkey.</p>
            <p class="qt-actions">
              <button type="button" class="qt-button" data-variant="secondary" data-action="passkey" data-t="signIn.passkey.submit">
                Use a passkey
              </button>
            </p>
            <div class="qt-message" aria-live="polite" data-part="passkey-feedback"></div>
          </section>

          <section class="qt-stack" data-show="social">
            <h2 data-t="signIn.social">Continue with</h2>
            <ul class="qt-social-list">
              <template data-item="social">
                <li>
                  <button
                    type="button"
                    class="qt-button"
                    data-variant="secondary"
                    data-action="social"
                    data-field="name"
                  ></button>
                </li>
              </template>
            </ul>
            <div class="qt-message" aria-live="polite" data-part="social-feedback"></div>
          </section>

          <p><a href="/sign-up" data-link data-t="signIn.newHere">Create an account</a></p>
        </div>

        <div data-state="second-factor" class="qt-stack qt-stack--lg">
          <p class="qt-prose__lede" data-t="signIn.second.lede">
            Confirm it's you with your second factor.
          </p>
          <form data-form="second" data-show="second_totp" class="qt-form" novalidate>
            <p class="qt-form-group">
              <label class="qt-label" for="qtiauth-f-second-code" data-t="signIn.second.code">
                Code from your authenticator app, or a recovery code
              </label>
              <input
                class="qt-input"
                id="qtiauth-f-second-code"
                name="code"
                type="text"
                autocomplete="one-time-code"
                required
              />
            </p>
            <p class="qt-actions">
              <button type="submit" class="qt-button" data-variant="primary" data-t="signIn.second.submit">Continue</button>
            </p>
          </form>
          <section data-show="second_passkey">
            <p class="qt-actions">
              <button type="button" class="qt-button" data-variant="secondary" data-action="second-passkey" data-t="signIn.second.passkey">
                Use a passkey
              </button>
            </p>
          </section>
          <div class="qt-message" aria-live="polite" data-part="second-feedback"></div>
        </div>
      </div>
    </div>
    <footer class="qt-auth-card__footer qt-prose">
      <p class="qt-text-muted"><small>&copy; <span data-field="company_name"></span></small></p>
    </footer>
  </section>
</div>
