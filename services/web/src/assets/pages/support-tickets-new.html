<h2 data-t="routes.tickets.new.title">Open a support ticket</h2>
<p class="qtiauth-lede" data-t="tickets.new.lede">
  Choose a category and describe what you need help with.
</p>

<form data-form="ticket" novalidate>
  <p class="qtiauth-field">
    <label for="qtiauth-f-category" data-t="field.category">Category</label>
    <select id="qtiauth-f-category" name="category_id" data-part="categories" required>
      <option value="" data-t="tickets.new.pickCategory">Choose a category</option>
      <template data-item="categories">
        <option data-bind-value="id" data-field="name"></option>
      </template>
    </select>
  </p>
  <p class="qtiauth-field">
    <label for="qtiauth-f-subject" data-t="field.subject">Subject</label>
    <input id="qtiauth-f-subject" name="subject" type="text" required />
  </p>
  <p class="qtiauth-field">
    <label for="qtiauth-f-body" data-t="field.message">Message</label>
    <textarea id="qtiauth-f-body" name="body" rows="6" required></textarea>
  </p>
  <p class="qtiauth-actions">
    <button type="submit" data-t="tickets.new.submit">Open ticket</button>
  </p>
</form>

<template data-message="categories-error">
  <option value="" disabled data-t="tickets.new.categoryLoadError">
    Could not load categories.
  </option>
</template>
