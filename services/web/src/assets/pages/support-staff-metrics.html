<h2 data-t="routes.support.staff.metrics.title">Support metrics</h2>

<div data-slot="metrics">
  <dl class="qtiauth-details" data-state="ready">
    <dt data-t="support.staff.metrics.firstResponse">Average first response (seconds)</dt>
    <dd data-field="first_response">0</dd>
    <dt data-t="support.staff.metrics.resolution">Average resolution (seconds)</dt>
    <dd data-field="resolution">0</dd>
    <dt data-t="support.staff.metrics.guest">Guest tickets</dt>
    <dd data-field="guest">0</dd>
  </dl>
  <p class="qtiauth-empty" data-state="empty" data-t="support.staff.metrics.empty">
    No metrics available.
  </p>
  <p class="qtiauth-empty" data-state="error" data-t="support.staff.metrics.load.error">
    Could not load metrics.
  </p>
</div>
