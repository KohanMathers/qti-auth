<div class="qt-auth-shell">
  <button class="qt-theme-toggle" type="button" data-action="toggle-theme" aria-label="Toggle theme">
    <svg class="qt-theme-toggle__sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
    <svg class="qt-theme-toggle__moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>
  <section class="qt-auth-card" aria-labelledby="qt-guest-title">
    <header class="qt-auth-card__header">
      <a class="qt-brand" href="/" data-link>
        <span class="qt-brand__name" data-field="product_name"></span>
      </a>
    </header>

    <div class="qt-auth-card__body qt-stack qt-stack--lg">
      <header>
        <h2 id="qt-guest-title" data-t="routes.guest.title">Contact support without signing in</h2>
        <p class="qtiauth-lede" data-t="guest.lede">Enter your email to receive a one-time code.</p>
      </header>

      <form data-form="code" class="qt-form" novalidate>
        <p class="qtiauth-field qt-field">
          <label for="qtiauth-f-email" class="qt-label" data-t="field.email">Email</label>
          <input
            id="qtiauth-f-email"
            class="qt-input"
            name="email"
            type="email"
            autocomplete="email"
            required
          />
        </p>
        <div class="qtiauth-feedback qt-message" aria-live="polite" data-part="form-feedback"></div>
        <p class="qtiauth-actions qt-actions">
          <button type="submit" class="qt-button" data-variant="primary" data-t="guest.code.submit">Send code</button>
        </p>
        <template data-message="success">
          <p class="qtiauth-success qt-message" data-variant="success" role="status" data-t="guest.code.sent">
            Check your email for the code.
          </p>
        </template>
      </form>

      <p class="qt-text-small qt-text-muted">
        <a href="/guest/view" data-link data-t="guest.haveLink">Already have a link?</a>
      </p>
    </div>

    <footer class="qt-auth-card__footer qt-prose">
      <p class="qt-text-muted"><small>&copy; <span data-field="company_name"></span></small></p>
    </footer>
  </section>
</div>
