<div class="qt-kb-shell">
  <header class="qt-kb-topbar qt-container">
    <a class="qt-brand" href="/support" data-link><span data-field="product_name"></span> Help</a>
    <form class="qt-kb-search" data-form="kb-search" novalidate>
      <input type="search" name="q" placeholder="Search help" aria-label="Search help" />
    </form>
    <button class="qt-theme-toggle" type="button" data-action="toggle-theme" aria-label="Toggle theme"></button>
  </header>

  <section class="qt-kb-article qt-prose">
    <nav class="qt-breadcrumb" aria-label="Breadcrumb">
      <ol>
        <li><a href="/support" data-link>Home</a></li>
        <li aria-current="page"><span data-field="name"></span></li>
      </ol>
    </nav>

    <h2 data-t="routes.kb.category.title" data-field="name">Category</h2>
    <p class="qtiauth-lede qt-text-muted" data-field="description"></p>

    <div data-slot="articles">
      <ul class="qtiauth-list qt-kb-article-list" data-state="list">
        <template data-item="articles">
          <li class="qt-kb-article-list__item">
            <a class="qt-kb-article-list__link" data-link data-bind-href="path">
              <span class="qt-kb-article-list__title" data-field="title"></span>
              <span class="qt-kb-article-list__excerpt qt-text-muted" data-field="excerpt"></span>
            </a>
          </li>
        </template>
      </ul>
      <div class="qt-empty-state qtiauth-empty" data-state="empty">
        <h3 class="qt-empty-state__title" data-t="kb.category.empty">No articles in this category.</h3>
      </div>
      <p class="qt-message qtiauth-empty" data-variant="danger" data-state="error" role="alert" data-t="kb.category.load.error">
        Could not load category.
      </p>
    </div>
  </section>
</div>
