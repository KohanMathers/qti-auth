<h2 data-t="routes.achievements.title">Achievements</h2>

<form data-form="game" novalidate>
  <p class="qtiauth-field">
    <label for="qtiauth-f-game" data-t="field.game">Game</label>
    <select id="qtiauth-f-game" name="game" required>
      <template data-item="games">
        <option data-bind-value="slug" data-field="name"></option>
      </template>
    </select>
  </p>
  <p class="qtiauth-actions">
    <button type="submit" data-t="games.load">Load</button>
  </p>
</form>

<div class="qtiauth-status" data-slot="rows">
  <ul class="qtiauth-list" data-state="list">
    <template data-item="rows">
      <li data-field="label"></li>
    </template>
  </ul>
  <p class="qtiauth-empty" data-state="empty" data-t="games.section.empty">Nothing to show.</p>
  <p class="qtiauth-empty" data-state="error" data-t="games.load.error">
    Could not load your games.
  </p>
</div>
