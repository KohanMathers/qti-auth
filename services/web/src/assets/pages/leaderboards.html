<div class="qt-app-shell">
  <header class="qt-app-nav" role="banner">
    <div class="qt-app-nav__inner qt-container">
      <a class="qt-brand" href="/" data-link><span class="qt-brand__name" data-field="product_name"></span></a>
      <nav class="qt-app-nav__links" aria-label="Primary">
        <a href="/games" data-link>Games</a>
        <a href="/account" data-link>Account</a>
        <a href="/support" data-link>Support</a>
      </nav>
      <div class="qt-app-nav__user qt-cluster">
        <button class="qt-theme-toggle" type="button" data-action="toggle-theme" aria-label="Toggle theme"></button>
        <details class="qt-user-menu">
          <summary><span class="qt-avatar" data-field="initials"></span><span data-field="username"></span></summary>
          <ul>
            <li><a href="/account" data-link>Account</a></li>
            <li><button type="button" data-action="sign-out" data-t="account.signOut">Sign out</button></li>
          </ul>
        </details>
      </div>
    </div>
  </header>

  <div class="qt-app-body qt-container">
    <aside class="qt-app-sidebar" aria-label="Games sections">
      <nav class="qt-nav-list" aria-label="Games sections">
        <a href="/games" data-link>Library</a>
        <a href="/games/redeem" data-link data-t="games.section.redeem">Redeem a key</a>
        <a href="/games/achievements" data-link data-t="games.section.achievements">Achievements</a>
        <a href="/games/stats" data-link data-t="games.section.stats">Stats</a>
        <a href="/games/leaderboards" data-link data-current="page" data-t="games.section.leaderboards">Leaderboards</a>
        <a href="/games/devices" data-link data-t="games.section.devices">Devices</a>
      </nav>
    </aside>

    <section class="qt-app-main qt-stack qt-stack--lg">
      <header>
        <h2 data-t="routes.leaderboards.title">Leaderboards</h2>
      </header>

      <article class="qt-card">
        <div class="qt-card__body">
          <form data-form="game" class="qt-form" novalidate>
            <p class="qtiauth-field">
              <label for="qtiauth-f-game" class="qt-label" data-t="field.game">Game</label>
              <select id="qtiauth-f-game" class="qt-select" name="game" required>
                <template data-item="games">
                  <option data-bind-value="slug" data-field="name"></option>
                </template>
              </select>
            </p>
            <p class="qtiauth-field">
              <label for="qtiauth-f-stat" class="qt-label" data-t="field.stat">Stat</label>
              <input id="qtiauth-f-stat" class="qt-input" name="stat" type="text" autocomplete="off" required />
            </p>
            <p class="qtiauth-field">
              <label for="qtiauth-f-board" class="qt-label" data-t="field.board">Leaderboard</label>
              <input id="qtiauth-f-board" class="qt-input" name="board" type="text" autocomplete="off" required />
            </p>
            <p class="qtiauth-actions qt-actions">
              <button type="submit" class="qt-button" data-variant="primary" data-t="games.load">Load</button>
            </p>
          </form>
        </div>
      </article>

      <div class="qtiauth-status" data-slot="rows">
        <div class="qt-table-wrap" data-state="list">
          <table class="qt-table" data-variant="zebra" data-size="md">
            <thead>
              <tr>
                <th scope="col" data-t="leaderboards.col.rank">Rank</th>
                <th scope="col" data-t="leaderboards.col.player">Player</th>
                <th scope="col" data-t="leaderboards.col.score">Score</th>
              </tr>
            </thead>
            <tbody>
              <template data-item="rows">
                <tr>
                  <td data-field="rank"></td>
                  <td data-field="label"></td>
                  <td data-field="score"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <p class="qtiauth-empty qt-empty-state" data-state="empty" data-t="games.section.empty">Nothing to show.</p>
        <p class="qtiauth-empty qt-message" data-variant="danger" data-state="error" role="alert" data-t="games.load.error">
          Could not load your games.
        </p>
        <nav class="qt-pagination" aria-label="Pagination" data-slot="pagination">
          <a class="qt-button" data-variant="ghost" data-size="sm" data-link data-bind-href="prev_href" rel="prev" data-t="pagination.prev">Previous</a>
          <ol>
            <template data-item="pages">
              <li><a data-link data-bind-href="href" data-field="label"></a></li>
            </template>
          </ol>
          <a class="qt-button" data-variant="ghost" data-size="sm" data-link data-bind-href="next_href" rel="next" data-t="pagination.next">Next</a>
        </nav>
      </div>
    </section>
  </div>
</div>
