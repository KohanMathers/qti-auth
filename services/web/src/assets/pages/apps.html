<h2 data-t="routes.apps.title">Authorised apps</h2>
<p class="qtiauth-lede" data-t="routes.apps.body">Apps you have signed in to with your account.</p>

<div data-slot="apps">
  <ul class="qtiauth-list" data-state="list">
    <template data-item="apps">
      <li>
        <span data-field="name"></span>
        <button type="button" data-action="revoke" data-t="apps.revoke">Revoke</button>
      </li>
    </template>
  </ul>
  <p class="qtiauth-empty" data-state="empty" data-t="apps.empty">No apps are connected.</p>
  <p class="qtiauth-empty" data-state="error" data-t="apps.load.error">Could not load apps.</p>
</div>
