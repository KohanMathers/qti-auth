<h2 data-t="routes.verify.title">Verify your email</h2>
<p class="qtiauth-lede" data-t="verify.lede">Enter the code we emailed you.</p>

<form data-form="verify" novalidate>
  <p class="qtiauth-field">
    <label for="qtiauth-f-token" data-t="field.token">Code</label>
    <input
      id="qtiauth-f-token"
      name="token"
      type="text"
      autocomplete="one-time-code"
      data-bind-value="token"
      required
    />
  </p>
  <p class="qtiauth-actions">
    <button type="submit" data-t="verify.submit">Verify email</button>
  </p>
  <template data-message="success">
    <p class="qtiauth-success" role="status" data-t="verify.success">Email verified.</p>
  </template>
</form>

<h3 data-t="verify.resend.heading">Need a new email?</h3>
<form data-form="resend" novalidate>
  <p class="qtiauth-field">
    <label for="qtiauth-f-resend-email" data-t="field.email">Email</label>
    <input id="qtiauth-f-resend-email" name="email" type="email" autocomplete="email" required />
  </p>
  <p class="qtiauth-actions">
    <button type="submit" class="qtiauth-button qtiauth-button-ghost" data-t="verify.resend">
      Send a new email
    </button>
  </p>
  <template data-message="success">
    <p class="qtiauth-success" role="status" data-t="verify.resend.success">
      If that address is waiting to be verified, we’ve sent a new link.
    </p>
  </template>
</form>
