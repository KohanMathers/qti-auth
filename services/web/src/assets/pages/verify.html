<div class="qt-auth-shell">
  <button class="qt-theme-toggle" type="button" data-action="toggle-theme" aria-label="Toggle theme">
    <svg class="qt-theme-toggle__sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
    <svg class="qt-theme-toggle__moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>
  <section class="qt-auth-card" aria-labelledby="qt-verify-title">
    <header class="qt-auth-card__header">
      <a class="qt-brand" href="/" data-link><span class="qt-brand__name" data-field="product_name"></span></a>
    </header>
    <div class="qt-auth-card__body qt-stack qt-stack--lg">
      <header>
        <h1 id="qt-verify-title" data-t="routes.verify.title">Verify your email</h1>
        <p class="qt-prose__lede" data-t="verify.lede">Enter the code we emailed you.</p>
      </header>

      <form data-form="verify" class="qt-form" novalidate>
        <p class="qt-form-group">
          <label class="qt-label" for="qtiauth-f-token" data-t="field.token">Code</label>
          <input
            class="qt-input"
            id="qtiauth-f-token"
            name="token"
            type="text"
            autocomplete="one-time-code"
            data-bind-value="token"
            required
          />
        </p>
        <p class="qt-actions">
          <button type="submit" class="qt-button" data-variant="primary" data-t="verify.submit">Verify email</button>
        </p>
        <template data-message="success">
          <p class="qt-message" data-variant="success" role="status" data-t="verify.success">Email verified.</p>
        </template>
      </form>

      <section class="qt-stack">
        <h2 data-t="verify.resend.heading">Need a new email?</h2>
        <form data-form="resend" class="qt-form" novalidate>
          <p class="qt-form-group">
            <label class="qt-label" for="qtiauth-f-resend-email" data-t="field.email">Email</label>
            <input class="qt-input" id="qtiauth-f-resend-email" name="email" type="email" autocomplete="email" required />
          </p>
          <p class="qt-actions">
            <button type="submit" class="qt-button" data-variant="ghost" data-t="verify.resend">
              Send a new email
            </button>
          </p>
          <template data-message="success">
            <p class="qt-message" data-variant="success" role="status" data-t="verify.resend.success">
              If that address is waiting to be verified, we've sent a new link.
            </p>
          </template>
        </form>
      </section>
    </div>
    <footer class="qt-auth-card__footer qt-prose">
      <p class="qt-text-muted"><small>&copy; <span data-field="company_name"></span></small></p>
    </footer>
  </section>
</div>
